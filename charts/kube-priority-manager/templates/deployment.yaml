apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-priority-manager.name" . }}
  namespace: {{ include "kube-priority-manager.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-priority-manager.name" . }}
  namespace: {{ include "kube-priority-manager.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: kube-priority-manager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-priority-manager }
    spec:
      serviceAccountName: {{ include "kube-priority-manager.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --annotation-key={{ .Values.manager.annotationKey }}
            - --minimum-priority={{ .Values.manager.minimumPriority }}
            - --maximum-priority-exclusive={{ .Values.manager.maximumPriorityExclusive }}
            - --preemption-policy={{ .Values.manager.preemptionPolicy }}
            - --conflict-policy={{ .Values.manager.conflictPolicy }}
            - --annotation-removal-policy={{ .Values.manager.annotationRemovalPolicy }}
            - --enable-priorityclass-gc={{ .Values.manager.enablePriorityClassGC }}
            - --priorityclass-gc-grace-period={{ .Values.manager.priorityClassGCGracePeriod }}
            - --webhook-failure-policy={{ .Values.manager.webhookFailurePolicy }}
            - --excluded-namespaces={{ .Values.manager.excludedNamespaces }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
            - { name: webhook, containerPort: 9443 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: webhook-certs, mountPath: /tmp/k8s-webhook-server/serving-certs, readOnly: true }
      volumes:
        - name: webhook-certs
          secret: { secretName: kube-priority-manager-webhook-server-cert }
