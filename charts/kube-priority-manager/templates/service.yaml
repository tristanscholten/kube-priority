apiVersion: v1
kind: Service
metadata:
  name: kube-priority-manager-webhook
  namespace: {{ include "kube-priority-manager.namespace" . }}
spec:
  selector: { app.kubernetes.io/name: kube-priority-manager }
  ports:
    - { name: webhook, port: 443, targetPort: webhook }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-priority-manager-metrics
  namespace: {{ include "kube-priority-manager.namespace" . }}
spec:
  selector: { app.kubernetes.io/name: kube-priority-manager }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
