---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-priority-manager-system
  labels:
    app.kubernetes.io/name: kube-priority-manager
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-priority-manager
  namespace: kube-priority-manager-system
  labels:
    app.kubernetes.io/name: kube-priority-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-priority-manager
rules:
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "replicationcontrollers"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-priority-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-priority-manager
subjects:
  - kind: ServiceAccount
    name: kube-priority-manager
    namespace: kube-priority-manager-system
---
apiVersion: v1
kind: Service
metadata:
  name: kube-priority-manager-webhook
  namespace: kube-priority-manager-system
  labels:
    app.kubernetes.io/name: kube-priority-manager
spec:
  selector:
    app.kubernetes.io/name: kube-priority-manager
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
---
apiVersion: v1
kind: Service
metadata:
  name: kube-priority-manager-metrics
  namespace: kube-priority-manager-system
  labels:
    app.kubernetes.io/name: kube-priority-manager
spec:
  selector:
    app.kubernetes.io/name: kube-priority-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-priority-manager
  namespace: kube-priority-manager-system
  labels:
    app.kubernetes.io/name: kube-priority-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-priority-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-priority-manager
    spec:
      serviceAccountName: kube-priority-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/tristanscholten/kube-priority-manager:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --annotation-key=kube-priority.hstr.nl
            - --minimum-priority=-2147483648
            - --maximum-priority-exclusive=1000000000
            - --preemption-policy=PreemptLowerPriority
            - --conflict-policy=reject
            - --annotation-removal-policy=retain
            - --webhook-failure-policy=Fail
            - --excluded-namespaces=kube-system,kube-priority-manager-system
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: webhook
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: kube-priority-manager-webhook-server-cert
      terminationGracePeriodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kube-priority-manager
  namespace: kube-priority-manager-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-priority-manager
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kube-priority-manager-selfsigned
  namespace: kube-priority-manager-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-priority-manager-serving-cert
  namespace: kube-priority-manager-system
spec:
  secretName: kube-priority-manager-webhook-server-cert
  dnsNames:
    - kube-priority-manager-webhook.kube-priority-manager-system.svc
    - kube-priority-manager-webhook.kube-priority-manager-system.svc.cluster.local
  issuerRef:
    name: kube-priority-manager-selfsigned
    kind: Issuer
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kube-priority-manager-mutating
  annotations:
    cert-manager.io/inject-ca-from: kube-priority-manager-system/kube-priority-manager-serving-cert
webhooks:
  - name: mutate.kube-priority.hstr.nl
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    clientConfig:
      service:
        namespace: kube-priority-manager-system
        name: kube-priority-manager-webhook
        path: /mutate
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-priority-manager-system"]
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "replicationcontrollers"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs", "cronjobs"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-priority-manager-validating
  annotations:
    cert-manager.io/inject-ca-from: kube-priority-manager-system/kube-priority-manager-serving-cert
webhooks:
  - name: validate.kube-priority.hstr.nl
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
    clientConfig:
      service:
        namespace: kube-priority-manager-system
        name: kube-priority-manager-webhook
        path: /validate
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-priority-manager-system"]
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "replicationcontrollers"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs", "cronjobs"]
