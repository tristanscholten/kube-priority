apiVersion: v1
kind: Pod
metadata:
  name: direct-pod
  annotations:
    kube-priority.hstr.nl: "100"
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: important-api
  annotations:
    kube-priority.hstr.nl: "750000"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: important-api
  template:
    metadata:
      labels:
        app: important-api
    spec:
      containers:
        - name: api
          image: nginx:stable
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: important-stateful
  annotations:
    kube-priority.hstr.nl: "500000"
spec:
  serviceName: important-stateful
  replicas: 1
  selector:
    matchLabels:
      app: important-stateful
  template:
    metadata:
      labels:
        app: important-stateful
    spec:
      containers:
        - name: web
          image: nginx:stable
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: important-agent
  annotations:
    kube-priority.hstr.nl: "250000"
spec:
  selector:
    matchLabels:
      app: important-agent
  template:
    metadata:
      labels:
        app: important-agent
    spec:
      containers:
        - name: agent
          image: nginx:stable
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: important-rs
  annotations:
    kube-priority.hstr.nl: "200000"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: important-rs
  template:
    metadata:
      labels:
        app: important-rs
    spec:
      containers:
        - name: web
          image: nginx:stable
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: important-rc
  annotations:
    kube-priority.hstr.nl: "100000"
spec:
  replicas: 1
  selector:
    app: important-rc
  template:
    metadata:
      labels:
        app: important-rc
    spec:
      containers:
        - name: web
          image: nginx:stable
---
apiVersion: batch/v1
kind: Job
metadata:
  name: important-job
  annotations:
    kube-priority.hstr.nl: "0"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.37
          command: ["sh", "-c", "echo important"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: important-cron
  annotations:
    kube-priority.hstr.nl: "-10"
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: busybox:1.37
              command: ["sh", "-c", "echo important"]
