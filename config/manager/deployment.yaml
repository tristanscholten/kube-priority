apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-priority
  namespace: kube-priority-system
  labels:
    app.kubernetes.io/name: kube-priority
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-priority
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-priority
    spec:
      serviceAccountName: kube-priority
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/tristanscholten/kube-priority:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --annotation-key=kube-priority.hstr.nl
            - --minimum-priority=-2147483648
            - --maximum-priority-exclusive=1000000000
            - --preemption-policy=PreemptLowerPriority
            - --conflict-policy=reject
            - --annotation-removal-policy=retain
            - --webhook-failure-policy=Fail
            - --excluded-namespaces=kube-system,kube-priority-system
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: webhook
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: kube-priority-webhook-server-cert
      terminationGracePeriodSeconds: 10
